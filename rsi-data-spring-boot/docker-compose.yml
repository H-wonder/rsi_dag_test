services:
  mysql:
    image: mysql:8.0
    container_name: rsi-data-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flowtest
      MYSQL_USER: flowtest
      MYSQL_PASSWORD: flowtest
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uflowtest", "-pflowtest"]
      interval: 5s
      timeout: 3s
      retries: 20
